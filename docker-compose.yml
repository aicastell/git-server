services:
  git:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpine:git-server
    container_name: git-server
    restart: always

    ports:
      - "${GIT_BIND_ADDRESS:-127.0.0.1}:${GIT_SSH_PORT:-2222}:22"

    volumes:
      - ${GIT_DATA_DIR:-./data}/repos:/git-server/repos
      - ${GIT_DATA_DIR:-./data}/keys:/git-server/keys:ro
      - ${GIT_DATA_DIR:-./data}/ssh-host-keys:/git-server/ssh-host-keys
